name: Build Android APK

# android/ 가 바뀌면 APK 를 빌드해 릴리스에 올린다.
# Poke3 에서는 늘 같은 주소로 최신 APK 를 받는다:
#   https://github.com/nodeul99-dev/eink_dashboard/releases/latest/download/eink-dashboard.apk
on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build release APK
        env:
          VERSION_CODE: ${{ github.run_number }}
        run: gradle -p android assembleRelease --no-daemon

      - name: Rename APK
        run: cp android/app/build/outputs/apk/release/app-release.apk eink-dashboard.apk

      - uses: actions/upload-artifact@v4
        with:
          name: eink-dashboard-apk
          path: eink-dashboard.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: 대시보드 앱 1.0.${{ github.run_number }}
          body: |
            Poke3 대시보드 전용 앱. Poke3 브라우저에서 아래 주소로 받아 설치한다.
            https://github.com/nodeul99-dev/eink_dashboard/releases/latest/download/eink-dashboard.apk
          files: eink-dashboard.apk
          make_latest: true
