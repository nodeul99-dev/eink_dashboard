<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>업무 캘린더</title>
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<main id="app">
  <!-- 위 2/3: 업무 캘린더 -->
  <div class="pane cal" id="cal">
    <div class="fit" id="cal-fit">
      <header class="top">
        <div class="date" id="date">&nbsp;</div>
        <div class="clock" id="clock">&nbsp;</div>
      </header>

      <section class="hero" id="hero"></section>

      <section>
        <h2>오늘 <span class="h2r" id="today-done"></span></h2>
        <ul class="list" id="today"></ul>
      </section>

      <section>
        <h2 id="week-title">이번 주</h2>
        <div id="week"></div>
      </section>

      <section id="dday-section">
        <h2>마감</h2>
        <ul class="list" id="dday"></ul>
      </section>
    </div>
  </div>

  <p class="status" id="status">&nbsp;</p>

  <!-- 아래 1/3: 독서 인용구 -->
  <div class="pane quote" id="quote">
    <div class="fit" id="quote-fit"></div>
  </div>
</main>
<script src="assets/app.js"></script>
</body>
</html>
