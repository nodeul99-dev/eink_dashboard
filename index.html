<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>DS_CRO_대시보드</title>
<meta name="theme-color" content="#ffffff">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="assets/icons/icon-192.png">
<!-- 화면 파일(css·js)을 고치면 아래 v= 값을 함께 올린다. HTML 과 스크립트가 늘 짝이 맞게 받아진다 -->
<link rel="stylesheet" href="assets/style.css?v=20261024e">
</head>
<body>
<main id="app">
  <!-- 위 55%: 업무 캘린더 -->
  <div class="pane cal" id="cal">
    <div class="fit" id="cal-fit">
      <header class="top">
        <div class="date" id="date">&nbsp;</div>
      </header>

      <section class="hero" id="hero"></section>

      <section>
        <h2>오늘 <span class="h2r" id="today-done"></span></h2>
        <ul class="list" id="today"></ul>
      </section>

      <section>
        <h2>다가오는 일정</h2>
        <div id="week"></div>
      </section>

    </div>
  </div>

  <!-- 아래 45%: 독서 인용구 (책갈피) -->
  <div class="pane quote" id="quote">
    <!-- 제목은 글자 맞춤(축소) 대상 밖에 둔다: 긴 인용구가 와도 다른 칸 제목과 같은 크기 -->
    <h2>책갈피<button type="button" class="h2btn" id="quote-next" aria-label="다른 인용구"><svg viewBox="0 0 24 24" width="1em" height="1em" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.34-5.66" fill="none" stroke="#000" stroke-width="2.6" stroke-linecap="round"/><path d="M20 3.5v5.5h-5.5" fill="none" stroke="#000" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg></button></h2>
    <div class="fit" id="quote-fit"></div>
  </div>

  <!-- 맨 아래: 마지막 동기화 시각 -->
  <p class="status" id="status">&nbsp;</p>
</main>
<script src="assets/app.js?v=20261024e"></script>
</body>
</html>
